<article class="career-card" [style.--career-color]="career.color" [class.is-island-hover]="isIslandHovered">
  <div class="card-map-side">
    <div class="map-side-glow" aria-hidden="true"></div>

    <div class="diff-badge">
      <span class="diff-label">{{ visualProfile.difficulty }}</span>
    </div>
    <div class="distance-label">{{ visualProfile.distance }}</div>

    @if (scene; as mapScene) {
      <svg class="island-scene" viewBox="0 0 360 260" aria-hidden="true">
        <defs>
          <radialGradient id="card-ocean" cx="38%" cy="60%" r="70%">
            <stop offset="0%" stop-color="#071628"></stop>
            <stop offset="100%" stop-color="#040d1a"></stop>
          </radialGradient>

          <filter id="blur2"><feGaussianBlur stdDeviation="2"></feGaussianBlur></filter>
          <filter id="blur3"><feGaussianBlur stdDeviation="3"></feGaussianBlur></filter>
          <filter id="blur8"><feGaussianBlur stdDeviation="8"></feGaussianBlur></filter>
          <filter id="blur10"><feGaussianBlur stdDeviation="10"></feGaussianBlur></filter>
          <filter id="blur20"><feGaussianBlur stdDeviation="20"></feGaussianBlur></filter>
          <filter id="glow-sm">
            <feGaussianBlur stdDeviation="2" result="blur"></feGaussianBlur>
            <feMerge><feMergeNode in="blur"></feMergeNode><feMergeNode in="SourceGraphic"></feMergeNode></feMerge>
          </filter>
          <filter id="glow-lg">
            <feGaussianBlur stdDeviation="5" result="blur"></feGaussianBlur>
            <feMerge><feMergeNode in="blur"></feMergeNode><feMergeNode in="SourceGraphic"></feMergeNode></feMerge>
          </filter>

          <radialGradient [attr.id]="islandGradientId(mapScene.mainIsland)" [attr.cx]="islandGradientCx(mapScene.mainIsland)" [attr.cy]="islandGradientCy(mapScene.mainIsland)" r="60%">
            <stop offset="0%" stop-color="#0f2535"></stop>
            <stop offset="50%" stop-color="#081820"></stop>
            <stop offset="100%" stop-color="#040e18"></stop>
          </radialGradient>

          <radialGradient [attr.id]="highlandGradientId(mapScene.mainIsland)" cx="50%" cy="45%" r="65%">
            <stop offset="0%" stop-color="#1a3a28" stop-opacity="1"></stop>
            <stop offset="100%" stop-color="#0a1e18" stop-opacity="0"></stop>
          </radialGradient>

        </defs>

        <rect width="360" height="260" class="scene-ocean"></rect>

        <g class="island-hover-zone" (mouseenter)="setIslandHover(true)" (mouseleave)="setIslandHover(false)">
          <g class="island-stack">
            <path [attr.d]="mapScene.mainIsland.landPath" class="island-bloom" [attr.fill]="career.color"></path>
            <path [attr.d]="mapScene.mainIsland.landPath" class="island-ocean-glow" [attr.stroke]="career.color"></path>
            <path [attr.d]="mapScene.mainIsland.landPath" class="island-shore-glow" [attr.stroke]="career.color"></path>
            <path [attr.d]="mapScene.mainIsland.landPath" class="island-terrain" [attr.fill]="'url(#' + islandGradientId(mapScene.mainIsland) + ')'" ></path>

            @for (scale of contourScales; track scale) {
              <path [attr.d]="mapScene.mainIsland.landPath" class="terrain-inset" [attr.transform]="contourTransform(mapScene.mainIsland, scale)"></path>
            }

            <ellipse
              [attr.cx]="mapScene.mainIsland.highlandCx"
              [attr.cy]="mapScene.mainIsland.highlandCy"
              [attr.rx]="mapScene.mainIsland.highlandRx"
              [attr.ry]="mapScene.mainIsland.highlandRy"
              [attr.fill]="'url(#' + highlandGradientId(mapScene.mainIsland) + ')'"
              class="terrain-highland"
            ></ellipse>

            @for (crackPath of mapScene.mainIsland.crackPaths; track $index) {
              <path [attr.d]="crackPath" class="terrain-crack"></path>
            }

            <path [attr.d]="mapScene.mainIsland.landPath" class="island-shore-edge" [attr.stroke]="career.color"></path>
          </g>

          @for (isletPath of mapScene.mainIsland.isletPaths; track $index) {
            <g class="islet-stack">
              <path [attr.d]="isletPath" class="islet-fill" [attr.fill]="career.color"></path>
              <path [attr.d]="isletPath" class="islet-halo" [attr.stroke]="career.color"></path>
              <path [attr.d]="isletPath" class="islet-edge" [attr.stroke]="career.color"></path>
            </g>
          }
        </g>

        <polyline [attr.points]="mapScene.polylinePoints" class="route-deep"></polyline>
        <polyline [attr.points]="mapScene.polylinePoints" class="route-mid" [attr.stroke]="career.color"></polyline>
        <polyline [attr.points]="mapScene.polylinePoints" class="route-core" [ngClass]="routeDashClass"></polyline>

        <circle r="4" class="route-dot" filter="url(#glow-sm)">
          <animateMotion [attr.path]="mapScene.routePath" [attr.dur]="routeTravelDuration()" repeatCount="indefinite"></animateMotion>
        </circle>

        <g [attr.transform]="'translate(' + mapScene.startPoint.x + ',' + (mapScene.startPoint.y - 14) + ')'" class="route-label route-start">
          <rect x="-18" y="-10" width="36" height="14" rx="2" [attr.stroke]="career.color"></rect>
          <text x="0" y="0" text-anchor="middle">START</text>
        </g>

        <g [attr.transform]="'translate(' + mapScene.finishPoint.x + ',' + (mapScene.finishPoint.y - 14) + ')'" class="route-label route-finish">
          <rect x="-20" y="-10" width="40" height="14" rx="2" [attr.fill]="career.color"></rect>
          <text x="0" y="0" text-anchor="middle">FINISH</text>
        </g>

        @for (point of mapScene.waypoints; track trackByPoint($index, point)) {
          <g class="node-pin" [class.is-major]="isMajorWaypoint($index)" [attr.transform]="'translate(' + point.x + ',' + point.y + ')'" filter="url(#glow-sm)">
            <circle class="pin-pulse" r="0" [attr.stroke]="career.color">
              <animate attributeName="r" values="12;22" dur="2s" repeatCount="indefinite"></animate>
              <animate attributeName="opacity" values="0.6;0" dur="2s" repeatCount="indefinite"></animate>
            </circle>
            @if (isMajorWaypoint($index)) {
              <circle class="major-ring" r="17" [attr.stroke]="career.color"></circle>
            }

            <rect [attr.x]="isMajorWaypoint($index) ? -13 : -11" [attr.y]="isMajorWaypoint($index) ? -13 : -11" [attr.width]="isMajorWaypoint($index) ? 26 : 22" [attr.height]="isMajorWaypoint($index) ? 26 : 22" rx="4" class="pin-shell" [attr.stroke]="career.color" [attr.stroke-width]="isMajorWaypoint($index) ? 2 : 1.2"></rect>

            <g transform="translate(-7 -7)" class="pin-icon" color="rgba(255,255,255,0.85)">
              @switch (nodeIconType($index)) {
                @case ('math') {
                  <line x1="2" y1="12" x2="12" y2="2"></line>
                  <line x1="2" y1="7" x2="7" y2="2"></line>
                  <line x1="7" y1="12" x2="12" y2="7"></line>
                }
                @case ('database') {
                  <ellipse cx="7" cy="4" rx="5" ry="2"></ellipse>
                  <line x1="2" y1="4" x2="2" y2="10"></line>
                  <line x1="12" y1="4" x2="12" y2="10"></line>
                  <ellipse cx="7" cy="10" rx="5" ry="2"></ellipse>
                }
                @case ('shield') {
                  <path d="M7,1 L13,4 L13,8 C13,11 10,13 7,14 C4,13 1,11 1,8 L1,4 Z"></path>
                }
                @case ('cloud') {
                  <path d="M3,10 C1,10 1,7 3,7 C3,5 5,3 7,4 C8,2 12,2 12,6 C14,6 14,10 12,10 Z"></path>
                }
                @case ('rocket') {
                  <path d="M7,13 L7,8 M5,10 L2,13 M9,10 L12,13"></path>
                  <path d="M4,8 C4,4 7,1 7,1 C7,1 10,4 10,8"></path>
                }
                @case ('gear') {
                  <circle cx="7" cy="7" r="2.5"></circle>
                  <line x1="7" y1="1" x2="7" y2="3"></line>
                  <line x1="7" y1="11" x2="7" y2="13"></line>
                  <line x1="1" y1="7" x2="3" y2="7"></line>
                  <line x1="11" y1="7" x2="13" y2="7"></line>
                  <line x1="2.5" y1="2.5" x2="3.8" y2="3.8"></line>
                  <line x1="10.2" y1="10.2" x2="11.5" y2="11.5"></line>
                }
                @case ('certificate') {
                  <rect x="1" y="2" width="12" height="9" rx="1"></rect>
                  <circle cx="7" cy="11" r="2"></circle>
                  <line x1="5" y1="13" x2="9" y2="13"></line>
                }
                @default {
                  <polyline points="3,5 1,7 3,9"></polyline>
                  <polyline points="11,5 13,7 11,9"></polyline>
                  <line x1="8" y1="3" x2="6" y2="11"></line>
                }
              }
            </g>
          </g>
        }

        @for (particle of mapScene.particles; track $index) {
          <circle [attr.cx]="particle.x" [attr.cy]="particle.y" [attr.r]="particle.radius" class="scene-particle">
            <animate attributeName="cy" [attr.values]="particle.y + ';' + (particle.y - particle.drift) + ';' + particle.y" [attr.dur]="particle.duration + 's'" [attr.begin]="particle.delay + 's'" repeatCount="indefinite"></animate>
            <animate attributeName="opacity" values="0.2;0.85;0.2" [attr.dur]="particle.duration + 's'" [attr.begin]="particle.delay + 's'" repeatCount="indefinite"></animate>
          </circle>
        }
      </svg>
    }
  </div>

  <div class="card-info-side">
    <div class="card-top">
      <div class="card-title-row">
        <h3 class="career-name">{{ career.name }}</h3>
        <span class="career-rating">★ {{ visualProfile.rating }}</span>
      </div>

      <p class="career-tagline">{{ visualProfile.tagline }}</p>
    </div>

    <div class="card-bottom">
      <div class="card-tags">
        @for (tag of visualProfile.tags; track tag) {
          <span class="tag">{{ tag }}</span>
        }
      </div>

      <button class="card-cta" type="button" (click)="onExplore()">→</button>
    </div>
  </div>
</article>
